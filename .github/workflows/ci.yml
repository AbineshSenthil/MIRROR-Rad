name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The 413 MB checkpoint is not pulled (it would use LFS bandwidth on every
      # run). Model-dependent tests skip themselves; everything else runs,
      # including the check that the release manifest matches the code.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
